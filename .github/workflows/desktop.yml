name: desktop
# Builds the desktop app and its installers on each OS. The app is its own
# Cargo workspace in desktop/, so the core CI never builds Tauri.
on:
  pull_request:
    paths: ["desktop/**", "crates/**", "Cargo.lock", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["desktop/**", "crates/**", "Cargo.lock", ".github/workflows/desktop.yml"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage,deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
          key: desktop
      - name: Tauri CLI
        run: cargo install tauri-cli --version "~2.12" --locked
      - name: Icons from icons/source.png
        run: cargo tauri icon icons/source.png
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build the app and its installers
        run: cargo tauri build --bundles ${{ matrix.bundles }} -- --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracemark-desktop-${{ matrix.os }}
          path: |
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: desktop/Cargo.toml
          command: check advisories bans licenses sources
