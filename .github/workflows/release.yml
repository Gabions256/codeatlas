name: release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  # Dry run on pull requests that touch the release: build, test and package
  # every target, publish nothing.
  pull_request:
    paths: [".github/workflows/release.yml", "Cargo.toml", "Cargo.lock", "desktop/Cargo.toml", "desktop/tauri.conf.json"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked: runs on any x86_64 Linux, whatever its glibc.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Intel Macs. Cross-compiled on the Apple Silicon runner: the tests
          # run as arm64, the smoke test runs this binary under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read version, check tag
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p tracemark-cli --target ${{ matrix.target }}
      # The Intel Mac binary runs under Rosetta on the Apple Silicon runner.
      - if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Smoke test the built binary
        shell: bash
        run: |
          tracemark="target/${{ matrix.target }}/release/tracemark"
          if [ "${{ matrix.target }}" = "x86_64-apple-darwin" ]; then
            file "$tracemark" | grep -q x86_64
            tracemark_run() { arch -x86_64 "$tracemark" "$@"; }
          else
            tracemark_run() { "$tracemark" "$@"; }
          fi
          tracemark_run --version
          tracemark_run scan fixtures/typescript/sample
          tracemark_run --project fixtures/typescript/sample report --format html | grep -q "Tracemark report"
      - name: Package
        shell: bash
        run: |
          name="tracemark-v${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE README.md CHANGELOG.md "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/tracemark.exe" "$name/"
            7z a "$name.zip" "$name"
            asset="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/tracemark" "$name/"
            tar czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"
          else shasum -a 256 "$asset" > "$asset.sha256"; fi
          mkdir dist && mv "$asset" "$asset.sha256" dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.slug }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            slug: linux-x86_64
            bundles: appimage,deb
          - os: windows-latest
            slug: windows-x86_64
            bundles: nsis
          - os: macos-latest
            slug: macos-arm64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Read version, check it matches the tag and the app config
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' ../Cargo.toml)
          app=$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          conf=$(sed -n 's/^  "version": "\(.*\)",/\1/p' tauri.conf.json)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "$app" != "$version" ] || [ "$conf" != "$version" ]; then
            echo "::error::desktop version $app / tauri.conf.json $conf must equal $version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version}"
            exit 1
          fi
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: desktop
          key: desktop-release
      - run: cargo install tauri-cli --version "~2.12" --locked
      - run: cargo tauri icon icons/source.png
      - run: cargo tauri build --bundles ${{ matrix.bundles }} -- --locked
      - name: Package
        run: |
          shopt -s nullglob
          mkdir -p ../dist
          for f in target/release/bundle/*/*.AppImage target/release/bundle/*/*.deb target/release/bundle/*/*.exe target/release/bundle/*/*.dmg; do
            name="tracemark-desktop-v${VERSION}-${{ matrix.slug }}.${f##*.}"
            cp "$f" "../dist/$name"
            if command -v sha256sum >/dev/null; then (cd ../dist && sha256sum "$name" > "$name.sha256")
            else (cd ../dist && shasum -a 256 "$name" > "$name.sha256"); fi
          done
          ls ../dist
          test -n "$(ls ../dist)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.slug }}
          path: dist/
          if-no-files-found: error

  # Runs only for a tag, and only after every target built and passed.
  publish:
    if: github.ref_type == 'tag'
    needs: [build, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance: lets users check an archive was built by
      # this workflow from this repository (`gh attestation verify`).
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # A version with a suffix (0.1.0-rc.1) is marked as a pre-release.
        # The release stays a draft until it is reviewed and published by hand.
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --draft $prerelease --verify-tag \
            --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what changed. Binaries are not code-signed."
