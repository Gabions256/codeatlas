name: action-test
# Runs the published action on every OS, downloading the released binary,
# for each published release. Can also be run by hand for a given version.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release to test, without the leading v
        required: true

permissions:
  contents: read

jobs:
  install-and-review:
    name: install-and-review (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: echo "version=${INPUT:-${TAG#v}}" >> "$GITHUB_OUTPUT"
      - id: review
        uses: ./
        with:
          version: ${{ steps.version.outputs.version }}
          comment: "false"
      - name: Check the installed binary and the output
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RECOMMENDATION: ${{ steps.review.outputs.recommendation }}
        run: |
          tracemark --version | grep -qx "tracemark $VERSION"
          echo "recommendation: $RECOMMENDATION"
          test -n "$RECOMMENDATION"
