[workspace]
resolver = "2"
members = ["crates/atlas-domain", "crates/atlas-parser", "crates/atlas-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Gabions256/codeatlas"

[workspace.dependencies]
atlas-domain = { path = "crates/atlas-domain" }
atlas-parser = { path = "crates/atlas-parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-typescript = "0.23"

[workspace.lints.clippy]
all = "deny"
