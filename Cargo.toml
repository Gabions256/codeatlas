[workspace]
resolver = "2"
members = [
    "crates/atlas-domain",
    "crates/atlas-parser",
    "crates/atlas-index",
    "crates/atlas-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Gabions256/codeatlas"

[workspace.dependencies]
atlas-domain = { path = "crates/atlas-domain" }
atlas-parser = { path = "crates/atlas-parser" }
atlas-index = { path = "crates/atlas-index", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[workspace.lints.clippy]
all = "deny"
