[workspace]
resolver = "2"
members = [
    "crates/tracemark-domain",
    "crates/tracemark-parser",
    "crates/tracemark-index",
    "crates/tracemark-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/Gabions256/tracemark"

[workspace.dependencies]
tracemark-domain = { path = "crates/tracemark-domain", version = "0.4.0" }
tracemark-parser = { path = "crates/tracemark-parser", version = "0.4.0" }
tracemark-index = { path = "crates/tracemark-index", version = "0.4.0" }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[workspace.lints.clippy]
all = "deny"
