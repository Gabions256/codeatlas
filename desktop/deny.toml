# cargo-deny for the desktop app. Stricter choices live in ../deny.toml for
# the core; the desktop pulls in Tauri and the system web view bindings.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained. It reaches us only through the GTK 3
    # bindings Tauri uses on Linux, and is a build-time macro helper, not code
    # that runs in the app. Revisit when Tauri moves off GTK 3.
    { id = "RUSTSEC-2024-0370", reason = "build-time macro helper pulled in by Tauri's GTK 3 bindings; no maintained replacement upstream" },
]

[licenses]
# Licences compatible with distributing Tracemark under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
